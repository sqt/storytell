plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-relative-links
#   - jekyll-maps

# maps:
#   google:
#     api_key: ${{ YOUR_KEY_HERE }

relative_links:
  enabled: true
  collections: true

include:
  - _pages

remote_theme: mmistakes/minimal-mistakes@4.27.3

title: Storytell
locale: en-GB
description: "An evening of true stories, generous listening, and good company."
next_event: far_from_home

collections:
  events:
    output: true
    permalink: /events/:name/

defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      header:
        image: /assets/images/splash.png
  - scope:
      path: ""
      type: events
    values:
      layout: event
      author_profile: false
      header:
        image: /assets/images/splash.png
